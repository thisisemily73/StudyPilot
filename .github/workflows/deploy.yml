name: Deploy StudyPilot

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Build landing page
      - name: Install landing dependencies
        run: npm ci

      - name: Build landing page
        run: |
          cd landing
          npm run build

      - # Build app
        name: Install app dependencies
        working-directory: ./app
        run: npm ci

      - name: Build app
        working-directory: ./app
        run: |
          npm run build

      - name: Merge builds
        run: |
          mkdir -p combined
          cp -r landing/dist/* combined/
          mkdir -p combined/app
          cp -r app/dist/* combined/app/

      - # Deploy everything
        name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4